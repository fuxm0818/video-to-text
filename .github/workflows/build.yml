name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no ASR stack required)
        run: python -m unittest discover -s tests -v

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Fetch static ffmpeg
        run: python packaging/fetch_ffmpeg.py
      - name: Build .app
        run: python -m PyInstaller packaging/video_to_text.spec --noconfirm --distpath dist --workpath build
      - name: Verify ad-hoc signature
        run: |
          codesign -dv --verbose=2 "dist/视频转文字.app"
          codesign --verify --deep --strict "dist/视频转文字.app"
      - name: Package zip with licenses
        run: |
          mkdir -p release
          cp -R "dist/视频转文字.app" release/
          cp LICENSE NOTICE packaging/ffmpeg/LICENSE.GPL-2.0.txt release/
          ditto -c -k --sequesterRsrc release VideoToText-macos-arm64.zip
          shasum -a 256 VideoToText-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VideoToText-macos-arm64
          path: VideoToText-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Fetch static ffmpeg
        run: python packaging/fetch_ffmpeg.py
      - name: Build windowed executable
        run: python -m PyInstaller packaging/video_to_text.spec --noconfirm --distpath dist --workpath build
      - name: Package zip with licenses
        shell: pwsh
        run: |
          Copy-Item LICENSE, NOTICE, packaging\ffmpeg\LICENSE.GPL-2.0.txt -Destination dist\VideoToText\
          Compress-Archive -Path dist\VideoToText -DestinationPath VideoToText-windows-x64.zip
          Get-FileHash VideoToText-windows-x64.zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: VideoToText-windows-x64
          path: VideoToText-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: VideoToText-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            VideoToText-macos-arm64.zip
            VideoToText-windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
